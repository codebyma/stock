<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>주식 현황</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1115;
    --surface1:#171a20;
    --surface2:#1e232b;
    --border:#2a3038;
    --border-strong:#3a4149;
    --text1:#edf0f3;
    --text2:#9aa4b2;
    --text3:#5f6773;
    --mint:#4ade9a;
    --mint-dim:#1f3a2c;
    --gold:#e8b04b;
    --gold-dim:#3a2f18;
    --blue:#5b9bd5;
    --blue-dim:#1c2c3a;
    --red:#e2635a;
    --red-dim:#3a1e1c;
    --lime:#a3e635;
  }
  body.light-theme{
    --bg:#f6f5f2;
    --surface1:#ffffff;
    --surface2:#eef0f2;
    --border:#e0e3e7;
    --border-strong:#c8ccd2;
    --text1:#1b1f24;
    --text2:#5b6470;
    --text3:#8b93a0;
    --mint:#178a5c;
    --mint-dim:#dff3ea;
    --gold:#a8720f;
    --gold-dim:#faf0da;
    --blue:#2f6fb0;
    --blue-dim:#e5f0fa;
    --red:#c33a2f;
    --red-dim:#fbe7e5;
    --lime:#65a30d;
  }
  html{
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
  }
  *{box-sizing:border-box;touch-action:manipulation;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text1);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    transition:background .15s, color .15s;
    padding-bottom:calc(60px + env(safe-area-inset-bottom));
    overflow-x:hidden;
  }
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;font-family:'Roboto',sans-serif;letter-spacing:-0.4px;}
  .won-sign{font-size:1em;margin-right:1px;}
  .owner-tabs{
    display:flex;
    gap:8px;
    padding:16px 20px 0;
  }
  .owner-tab{
    flex:1;
    text-align:center;
    padding:10px 0;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface1);
    color:var(--text2);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .owner-tab.active{
    background:var(--mint-dim);
    border-color:var(--mint);
    color:var(--mint);
  }
  .summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:16px 20px 4px;
  }
  .metric{
    background:var(--surface1);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 14px;
  }
  .metric .label{font-size:12px;color:var(--text2);margin-bottom:6px;}
  .metric .value{font-size:19px;font-weight:500;}
  .metric.none{display:none;}

  main{padding:20px;}

  .section-divider-gray{
    height:8px;
    background:var(--border-strong);
  }

  .panel-wrap{padding:0 20px;}
  .panel-title{
    font-size:22px;
    font-weight:700;
    color:var(--text1);
    margin:22px 0 4px;
  }
  .panel-caption{font-size:11.5px;color:var(--text3);margin-bottom:10px;}
  .panel-empty{font-size:12.5px;color:var(--text3);padding:16px 0;}

  .div-chart-scroll{overflow-x:auto;padding-bottom:6px;}
  .div-chart{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    height:110px;
    min-width:max-content;
    padding:0 2px 2px;
  }
  .div-bar-col{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink:0;
    justify-content:flex-end;
    height:100%;
    cursor:pointer;
  }
  .div-bar-amount{
    font-size:9px;
    color:var(--text1);
    margin-bottom:6px;
    white-space:nowrap;
  }
  .div-bar{
    width:16px;
    height:var(--h, 2px);
    background:var(--gold);
    border-radius:3px 3px 0 0;
    min-height:2px;
  }
  .div-bar-label{
    font-size:10px;
    color:var(--text3);
    margin-top:6px;
    white-space:nowrap;
  }
  .div-bar-col.current .div-bar{background:var(--mint);}
  .div-bar-col.current .div-bar-label{color:var(--text1);font-weight:600;}
  .div-bar-col.current .div-bar-amount{color:var(--text1);font-weight:600;}

  .trend-svg-wrap{width:100%;}
  .trend-caption-row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--text3);
    margin-top:4px;
  }
  .trend-latest{
    font-size:18px;
    font-weight:600;
    color:var(--text1);
    margin-bottom:2px;
  }
  .trend-latest-delta{font-size:12px;margin-bottom:2px;}
  .trend-first-delta{font-size:11px;color:var(--text3);margin-bottom:8px;}

  .breakdown-wrap{padding:0 20px;}
  .breakdown-card{
    padding:0;
  }
  .breakdown-title{
    font-size:22px;
    font-weight:700;
    color:var(--text1);
    margin:22px 0 10px;
    cursor:pointer;
  }
  .breakdown-row{
    padding:14px 0;
  }
  .breakdown-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
  }
  .breakdown-name-block{min-width:0;flex:1;}
  .breakdown-name{font-weight:400;color:var(--text1);font-size:16px;}
  .breakdown-price-line{font-size:11.5px;color:var(--text2);margin-top:3px;}
  .breakdown-name + .breakdown-price-line{margin-top:7px;}
  .price-highlight{color:var(--mint);font-weight:400;}
  .breakdown-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0;}
  .breakdown-ratio{font-size:14px;font-weight:600;color:var(--text1);font-family:'Roboto',sans-serif;}
  .breakdown-pl{font-size:12px;line-height:1.3;font-family:'Roboto',sans-serif;}
  .breakdown-bar-track{
    height:6px;
    background:var(--surface2);
    border-radius:3px;
    overflow:hidden;
  }
  .breakdown-bar-fill{
    height:100%;
    width:var(--w, 0%);
    background:var(--mint);
    border-radius:3px;
  }

  .section-title{
    font-size:22px;
    font-weight:700;
    color:var(--text1);
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .add-btn{
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text1);
    border-radius:8px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
  }
  .add-btn:active{transform:scale(0.97);}

  .account-card{
    margin:0 -20px;
    margin:0 0 0 0;
    padding:0;
    border-bottom: 1px dashed var(--border);
  }
  /* .account-card:last-child{border-bottom:none;} */
  .account-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
    padding:18px 0;
    cursor:pointer;
  }
  .account-name{font-size:16px;font-weight:400;color:var(--text1);}
  .account-total{font-size:12px;color:var(--text3);margin-top:3px;}
  .account-body{
    display:none;
    padding:2px 20px 20px;
    padding:2px 0 20px;
  }
  .account-card.open .account-body{display:block;}

  .stock-row{
    cursor:pointer;
    padding:12px 0 14px 0;
  }
  .stock-row+.stock-row {
    margin-top:32px;
  }
  .stock-card-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .stock-card-title{flex:1;min-width:0;}
  .stock-card-name{font-size:16px;font-weight:400;color:var(--text1);}
  .stock-card-ticker{font-size:11px;color:var(--text3);font-weight:400;margin-left:4px;}
  .stock-stat-grid{
    display:flex;
    flex-wrap:wrap;
    gap:7px 16px;
    padding:0;
  }
  .stock-stat-grid.px-2{padding:0 2px;}
  .stock-stat{font-size:13px;flex:auto;min-width:45%;}
  .stock-stat:nth-child(odd){text-align:left;}
  .stock-stat:nth-child(even){text-align:right;}
  .stock-stat-label{color:var(--text2);margin-right:6px;}
  .stock-stat-value{color:var(--text1);}
  .stat-rows{display:flex;flex-direction:column;gap:7px;}
  .stat-rows.px-2{padding:0 2px;}
  .stat-row{display:flex;justify-content:space-between;gap:4px;}
  .stat-row .stock-stat{flex:none;min-width:0;}
  .stock-stat-value.text-red{color:var(--red);}
  .stock-stat-value.text-blue{color:var(--blue);}
  .stock-stat-value.price-highlight{color:var(--mint);}

  .entry-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:12.5px;
    padding:4px 0;
    border-bottom:1px solid var(--border);
    color:var(--text2);
  }
  .row-chevron{
    color:var(--text3);
    margin-left:2px;
    flex-shrink:0;
  }
  .row-right{
    display:flex;
    align-items:center;
  }
  .entry-row:last-child{border-bottom:none;}
  .entry-row .amt{color:var(--text1);}
  .entry-row .del{
    color:var(--red);
    cursor:pointer;
    margin-left:8px;
    font-size:10.5px;
    border:1px solid var(--red);
    border-radius:2px;
    padding:2px 6px;
    display:inline-block;
  }
  .entry-row .del-icon{
    cursor:pointer;
    margin-left:8px;
    font-size:11px;
    line-height:1;
  }
  .empty-hint{font-size:12px;color:var(--text3);padding:6px 0;}

  .yield-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:6px;
    margin:6px 0 4px;
  }
  .yield-card{
    background:var(--surface2);
    border-radius:8px;
    padding:8px 6px;
    text-align:center;
    cursor:pointer;
    position:relative;
  }
  .yield-card:active{background:var(--border);}
  .yield-label{font-size:9.5px;color:var(--text2);line-height:1.35;margin-bottom:5px;}
  .yield-value{font-size:14px;font-weight:600;color:var(--gold);}
  .yield-tooltip{
    position:fixed;
    max-width:230px;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    padding:10px 12px;
    border-radius:10px;
    font-size:11.5px;
    line-height:1.55;
    text-align:left;
    z-index:300;
    box-shadow:0 6px 20px rgba(0,0,0,0.35);
    opacity:0;
    transform:translateY(4px);
    transition:opacity .12s ease, transform .12s ease;
  }
  .yield-tooltip.show{opacity:1;transform:translateY(0);}
  .yield-tooltip-title{font-weight:600;color:var(--gold);margin-bottom:4px;font-size:11.5px;}
  .yield-tooltip-arrow{
    position:absolute;
    width:9px;height:9px;
    margin-left:-4.5px;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    transform:rotate(45deg);
  }
  .yield-tooltip-arrow.arrow-down{bottom:-5.5px;border-top:none;border-left:none;}
  .yield-tooltip-arrow.arrow-up{top:-5.5px;border-bottom:none;border-right:none;}

  .mini-add{
    background:none;
    border:1px dashed var(--border-strong);
    color:var(--text2);
    border-radius:7px;
    padding:5px 10px;
    font-size:11.5px;
    cursor:pointer;
  }
  .action-btn-prominent{
    flex:1;
    min-width:110px;
    background:var(--surface2);
    border:1.5px solid var(--mint);
    color:var(--mint);
    border-radius:4px;
    padding:8px 10px;
    font-size:12px;
    font-weight:600;
    text-align:center;
    cursor:pointer;
  }
  .action-btn-prominent:active{transform:scale(0.98);}
  .text-link-btn{
    background:none;
    border:none;
    color:var(--text2);
    font-size:13px;
    font-weight:500;
    text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;
    padding:4px 6px;
  }
  .cta-btn{
    flex:1;
background: var(--surface2);
    border: 1px solid var(--mint);
    color: var(--mint);
    border-radius:4px;
    padding:10px 12px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    text-align:center;
  }

  .form-panel{
    background:var(--surface1);
    border-top:1px dotted var(--border-strong);
    border-bottom:1px dotted var(--border-strong);
    padding:12px 0;
    margin:10px 0;
    display:none;
  }
  .form-panel.open{display:block;}
  #githubSettingsForm, #accountForm{background:none;}
  .title-info-trigger{
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .form-row{
    display:flex;
    gap:14px;
    margin-bottom:12px;
  }
  .form-row .field{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
    min-width:0;
  }
  .field-label{
    font-size:11px;
    color:var(--text2);
  }
  .form-row input, .form-row select{
    flex:1;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    border-radius:7px;
    padding:0 10px;
    height:42px;
    box-sizing:border-box;
    font-size:16px;
    min-width:0;
    width:100%;
    line-height:42px;
    -webkit-appearance:none;
    appearance:none;
    -moz-appearance:textfield;
  }
  .form-row input[type="number"]::-webkit-outer-spin-button,
  .form-row input[type="number"]::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .date-display-wrap{
    position:relative;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    border-radius:7px;
    height:42px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    padding:0 10px;
  }
  .date-display-text{
    font-size:16px;
    color:var(--text3);
    pointer-events:none;
    white-space:nowrap;
  }
  .date-display-text.has-value{color:var(--text1);}
  .date-native-hidden{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    border:none;
    opacity:0;
    cursor:pointer;
  }
  .form-row .field{overflow:hidden;}
  .form-row input::placeholder{color:var(--text3);}
  .form-actions{display:flex;gap:8px;justify-content:flex-end;}
  .btn-primary{
    background:var(--mint-dim);
    border:1px solid var(--mint);
    color:var(--mint);
    border-radius:7px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }
  .btn-ghost{
    background:none;
    border:1px solid var(--border-strong);
    color:var(--text2);
    border-radius:7px;
    padding:7px 14px;
    font-size:13px;
    cursor:pointer;
  }

  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text3);
    font-size:13px;
  }
  .json-panel{
    border-radius:12px;
    display:none;
  }
  .json-panel.open{display:block;}
  .json-panel textarea{
    width:100%;
    min-height:220px;
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    border-radius:8px;
    padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    line-height:1.5;
    resize:vertical;
  }
  .json-actions{
    display:flex;
    gap:8px;
    margin-top:10px;
    flex-wrap:wrap;
  }
  .json-error{
    color:var(--red);
    font-size:12px;
    margin-top:6px;
    display:none;
  }
  .json-error.show{display:block;}
  .save-status{
    font-size:11px;
    color:var(--text3);
    padding:24px 20px 0;
  }
  .toast{
    position:fixed;
    bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);
    background:var(--surface2);
    border:1px solid var(--border-strong);
    color:var(--text1);
    padding:10px 18px;
    border-radius:100px;
    width:max-content;
    max-width:90vw;
    box-sizing:border-box;
    text-align:center;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
    z-index:50;
  }
  .toast.show{opacity:1;}

  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:200;
  }
  .sheet-overlay.open{opacity:1;pointer-events:auto;}
  .bottom-sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    max-height:75vh;
    display:flex;
    flex-direction:column;
    background:var(--surface1);
    border-radius:16px 16px 0 0;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:201;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,0.3);
  }
  .bottom-sheet.open{transform:translateY(0);}
  .sheet-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-size:15px;
    font-weight:500;
    color:var(--text1);
  }
  .sheet-title-wrap{
    display:flex;
    align-items:center;
    gap:4px;
    min-width:0;
  }
  .sheet-back-btn{
    background:none;
    border:none;
    color:var(--text2);
    padding:0;
    margin-left:-4px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
  }
  .acc-stock-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:14px 0;
    border-bottom:1px dashed var(--border-strong);
    cursor:pointer;
  }
  .acc-stock-row:last-child{border-bottom:none;}
  .acc-stock-name{
    font-size:14px;
    font-weight:600;
    color:var(--text1);
    min-width:0;
  }
  .acc-stock-ticker{
    font-size:11.5px;
    font-weight:400;
    color:var(--text3);
    margin-left:4px;
  }
  .acc-stock-right{
    margin-left:auto;
    text-align:right;
    flex-shrink:0;
    font-size:14px;
    color:var(--text1);
  }
  .acc-stock-pl{font-size:12px;margin-top:2px;}
  .sheet-close-btn{
    background:none;
    border:none;
    color:var(--text2);
    font-size:24px;
    line-height:1;
    padding:0 4px;
    cursor:pointer;
  }
  .sheet-body{
    overflow-y:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .sheet-body::-webkit-scrollbar{display:none;}
  .sheet-body .entry-row{border-bottom:none;}

  .sheet-overlay2{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
    z-index:210;
  }
  .sheet-overlay2.open{opacity:1;pointer-events:auto;}
  .bottom-sheet2{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    max-height:75vh;
    display:flex;
    flex-direction:column;
    background:var(--surface1);
    border-radius:16px 16px 0 0;
    transform:translateY(100%);
    transition:transform .25s ease;
    z-index:211;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -8px 24px rgba(0,0,0,0.4);
  }
  .bottom-sheet2.open{transform:translateY(0);}

  /* ===== 공통 컴포넌트 (반복되는 레이아웃 패턴 통일) ===== */
  .header-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .button-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .button-row.center{justify-content:center;}
  .section-divider-gray.spaced-top{margin:40px 0 0;}
  .section-divider-gray.flush-top{margin:20px -20px 0;}
  .panel-title.title-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .panel-title.sub-title{font-size:14px;margin:0 0 8px;}
  .panel-caption.warning{color:var(--red);margin-bottom:8px;}
  .action-btn-prominent.full-width{width:100%;}
  .text-link-btn.danger{color:var(--red);}

<script>
let DATA = { owners: [], accounts: [], stocks: [] };
const CHEVRON_SVG = '<svg class="row-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>';
let currentOwner = null;
let openStocks = new Set();
let openTxSections = new Set();
let breakdownOpen = true;

const STORAGE_KEY = 'portfolio-data';
const hasWindowStorage = (typeof window !== 'undefined') && window.storage && typeof window.storage.get === 'function';
let dataSource = null; // 'server-json' | 'window-storage' | 'new'

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function fmtWon(n){ return '<span class="won-sign">₩</span>' + (n||0).toLocaleString('ko-KR'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function setSaveStatus(msg){
  const el = document.getElementById('saveStatus');
  if(el) el.textContent = msg;
}

function isValidPortfolio(obj){
  return !!(obj && obj.owners && obj.accounts && obj.stocks);
}

async function autoSaveTodaySnapshotIfNeeded(){
  ensureDataShape();
  const today = new Date().toISOString().slice(0,10);
  if(DATA.snapshots.some(s=>s.date===today)) return;
  upsertSnapshot();
  await saveData();
  showToast('오늘 자산 스냅샷을 자동으로 저장했어요');
}

async function finishLoad(){
  currentOwner = DATA.owners.length > 1 ? 'ALL' : (DATA.owners.length ? DATA.owners[0].id : null);
  await autoSaveTodaySnapshotIfNeeded();
  render();
}

async function loadData(){
  // 1순위: 같은 경로의 stock.json (서버에 올린 정적 파일)
  try{
    const res = await fetch('./stock.json', { cache:'no-store' });
    if(res.ok){
      const parsed = await res.json();
      if(isValidPortfolio(parsed)){
        DATA = parsed;
        dataSource = 'server-json';
        const priceUpdateNote = DATA.lastPriceUpdate ? (' · 시세 갱신: ' + DATA.lastPriceUpdate) : '';
        setSaveStatus('./stock.json 불러옴 · ' + new Date().toLocaleTimeString('ko-KR') + priceUpdateNote + ' · 자동저장 안 됨, 변경 후 내보내기 필요');
        await finishLoad();
        return;
      }
    }
  }catch(e){
    // 정적 서버가 아니거나(file:// 등) stock.json이 아직 없는 경우 — 다음 단계로
  }

  // 2순위: window.storage (미리보기 환경 등에서만 존재)
  if(hasWindowStorage){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        DATA = JSON.parse(res.value);
        dataSource = 'window-storage';
        setSaveStatus('마지막 저장 데이터를 불러왔습니다 · ' + new Date().toLocaleTimeString('ko-KR'));
        await finishLoad();
        return;
      }
    }catch(e){ /* 무시하고 아래로 */ }
  }

  // 3순위: 새 데이터
  DATA = defaultData();
  dataSource = 'new';
  setSaveStatus('새 데이터로 시작합니다 · stock.json을 서버에 올리면 자동으로 불러와요');
  await finishLoad();
}

function defaultData(){
  return {
    owners: [
      { id:'me', name:'나' },
      { id:'wife', name:'와이프' }
    ],
    accounts: [],
    stockCatalog: [],
    stocks: [],
    targets: {},
    snapshots: [],
    dividends: []
  };
}

function migrateStockCatalog(){
  if(!Array.isArray(DATA.stockCatalog)) DATA.stockCatalog = [];
  (DATA.stocks||[]).forEach(s=>{
    if(s.key) return; // 이미 마이그레이션됨
    const key = makeKeyFrom(s.ticker, s.name);
    let cat = catalogByKey(key);
    if(!cat){
      cat = { key, ticker: s.ticker||'', name: s.name||'(이름없음)', currentPrice: s.currentPrice||0 };
      DATA.stockCatalog.push(cat);
    }
    s.key = key;
    delete s.name;
    delete s.ticker;
    delete s.currentPrice;
  });
}

function ensureDataShape(){
  if(!DATA.targets) DATA.targets = {};
  if(!Array.isArray(DATA.snapshots)) DATA.snapshots = [];
  if(!Array.isArray(DATA.dividends)) DATA.dividends = [];
  migrateStockCatalog();
}

async function saveData(){
  if(hasWindowStorage){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(DATA), false);
    }catch(e){ /* 무시 */ }
  }
  if(dataSource === 'server-json'){
    setSaveStatus('임시 반영됨 (브라우저 안에서만) · ' + new Date().toLocaleTimeString('ko-KR') + ' · stock.json 내보내서 서버에 다시 올려야 저장돼요');
  } else {
    setSaveStatus('저장됨 · ' + new Date().toLocaleTimeString('ko-KR'));
  }
}

function render(){
  ensureDataShape();
  renderOwnerTabs();
  renderSummary();
  renderDividendCalendar();
  renderAssetTrend();
  renderBreakdown();
  renderAccounts();
  renderCatalogDatalists();
}

function renderCatalogDatalists(){
  const tickerList = document.getElementById('stockCatalogTickers');
  const nameList = document.getElementById('stockCatalogNames');
  if(!tickerList || !nameList) return;
  const cats = DATA.stockCatalog || [];
  tickerList.innerHTML = cats.filter(c=>c.ticker).map(c=>`<option value="${escapeHtml(c.ticker)}">${escapeHtml(c.name)}</option>`).join('');
  nameList.innerHTML = cats.map(c=>`<option value="${escapeHtml(c.name)}"></option>`).join('');
}

function renderOwnerTabs(){
  const el = document.getElementById('ownerTabs');
  el.innerHTML = '';
  if(DATA.owners.length > 1){
    const allBtn = document.createElement('div');
    allBtn.className = 'owner-tab' + (currentOwner==='ALL' ? ' active' : '');
    allBtn.textContent = '전체';
    allBtn.onclick = ()=>{ currentOwner = 'ALL'; render(); };
    el.appendChild(allBtn);
  }
  DATA.owners.forEach(o=>{
    const btn = document.createElement('div');
    btn.className = 'owner-tab' + (o.id===currentOwner ? ' active' : '');
    btn.textContent = o.name;
    btn.onclick = ()=>{ currentOwner = o.id; render(); };
    el.appendChild(btn);
  });
}

function accountsForOwner(ownerId){
  if(ownerId==='ALL') return DATA.accounts;
  return DATA.accounts.filter(a=>a.ownerId===ownerId);
}
function stocksForAccount(accountId){
  return DATA.stocks.filter(s=>s.accountId===accountId);
}
function stocksForOwner(ownerId){
  const accIds = accountsForOwner(ownerId).map(a=>a.id);
  return DATA.stocks.filter(s=>accIds.includes(s.accountId));
}
function catalogByKey(key){
  return (DATA.stockCatalog||[]).find(c=>c.key===key);
}
function catalogFor(stock){
  return catalogByKey(stock.key) || { key: stock.key, name:'(알 수 없는 종목)', ticker:'', currentPrice:0 };
}
function makeKeyFrom(ticker, name){
  return (ticker && ticker.trim()) ? ticker.trim().toUpperCase() : ('name:'+name);
}
function getOrCreateCatalog(ticker, name, initialPrice){
  const key = makeKeyFrom(ticker, name);
  if(!DATA.stockCatalog) DATA.stockCatalog = [];
  let cat = catalogByKey(key);
  if(!cat){
    cat = { key, ticker: (ticker||'').trim(), name: name, currentPrice: initialPrice||0 };
    DATA.stockCatalog.push(cat);
    return { cat, isNew: true };
  }
  return { cat, isNew: false };
}
function stockTotal(stock){
  return (stock.quantity || 0) * (catalogFor(stock).currentPrice || 0);
}
function stockCostBasis(stock){
  const buyTotal = (stock.buys||[]).reduce((s,b)=>s+(b.amount||0),0);
  const sellTotal = (stock.sells||[]).reduce((s,b)=>s+(b.amount||0),0);
  return buyTotal - sellTotal;
}
function stockPL(stock){
  return stockTotal(stock) - stockCostBasis(stock);
}
function stockPLPercent(stock){
  const cost = stockCostBasis(stock);
  if(!cost) return null;
  return (stockPL(stock) / cost) * 100;
}
function stockKey(stock){
  return stock.key || makeKeyFrom(stock.ticker, stock.name);
}
// 특정 계좌(종목 1건)가 기준일(dateStr, YYYY-MM-DD) 시점에 실제로 보유했던 수량을
// 매수/매도 내역의 날짜를 기준으로 다시 계산. 배당·매수·매도를 어떤 순서로 입력해도
// 항상 그 날짜 기준의 정확한 보유수량이 나오도록 하기 위한 함수.
function quantityAsOfDate(stock, dateStr){
  if(!dateStr) return stock.quantity || 0;
  const bought = (stock.buys||[]).filter(b=>b.date && b.date <= dateStr).reduce((s,b)=>s+(b.quantity||0),0);
  const sold = (stock.sells||[]).filter(b=>b.date && b.date <= dateStr).reduce((s,b)=>s+(b.quantity||0),0);
  return Math.max(0, bought - sold);
}
// 이 종목(계좌)의 매수/매도 내역이 바뀔 때마다, 이미 등록돼있는 배당 기록들의
// 수량·금액을 그 배당일 기준으로 다시 계산해서 맞춰준다.
// → 배당을 먼저 입력하고 매수/매도를 나중에 입력해도(또는 그 반대여도) 항상 정확해짐
function recalcDividendQuantitiesForStock(stock){
  if(!DATA.dividends || !DATA.dividends.length) return;
  const key = stockKey(stock);
  DATA.dividends.forEach(rec=>{
    if(rec.key !== key) return;
    const asOf = rec.date || (rec.month ? rec.month+'-28' : '');
    const qty = quantityAsOfDate(stock, asOf);
    const idx = rec.accounts.findIndex(a=>a.accountId===stock.accountId);
    if(qty<=0){
      if(idx>=0) rec.accounts.splice(idx,1);
    } else {
      const entry = { accountId: stock.accountId, quantity: qty, amount: qty * (rec.perShare||0) };
      if(idx>=0) rec.accounts[idx] = entry;
      else rec.accounts.push(entry);
    }
  });
  DATA.dividends = DATA.dividends.filter(rec=> rec.key!==key || rec.accounts.length>0);
}
function findDividendRecord(key, month){
  return (DATA.dividends||[]).find(d=>d.key===key && d.month===month);
}
// 같은 종목의 여러 계좌에 한 번에 등록(일괄 입력)
function upsertDividendGroupBulk(key, date, name, ticker, perShare, stockList){
  const month = date.slice(0,7);
  if(!DATA.dividends) DATA.dividends = [];
  let rec = findDividendRecord(key, month);
  if(!rec){
    rec = { id: uid('divrec'), key, name, ticker, month, date, perShare, accounts: [] };
    DATA.dividends.push(rec);
  } else {
    rec.date = date;
    rec.perShare = perShare;
  }
  stockList.forEach(s=>{
    if(s.quantity<=0) return;
    const amount = s.quantity * perShare;
    const idx = rec.accounts.findIndex(a=>a.accountId===s.accountId);
    if(idx>=0) rec.accounts[idx] = { accountId:s.accountId, quantity:s.quantity, amount };
    else rec.accounts.push({ accountId:s.accountId, quantity:s.quantity, amount });
  });
  return rec;
}
function deleteDividendRecord(key, month){
  DATA.dividends = (DATA.dividends||[]).filter(d=>!(d.key===key && d.month===month));
}
function removeAccountFromDividendRecord(key, month, accountId){
  const rec = findDividendRecord(key, month);
  if(!rec) return;
  rec.accounts = rec.accounts.filter(a=>a.accountId!==accountId);
  if(rec.accounts.length===0) deleteDividendRecord(key, month);
}
function recordsForKey(key){
  return (DATA.dividends||[]).filter(d=>d.key===key).sort((a,b)=>b.month.localeCompare(a.month));
}
function recordsForStock(stock){
  const key = stockKey(stock);
  return (DATA.dividends||[])
    .filter(rec=>rec.key===key)
    .map(rec=>{
      const acc = rec.accounts.find(a=>a.accountId===stock.accountId);
      if(!acc) return null;
      return { month:rec.month, perShare:rec.perShare, quantity:acc.quantity, amount:acc.amount };
    })
    .filter(Boolean);
}
function recordsForOwner(ownerId){
  const accIds = accountsForOwner(ownerId).map(a=>a.id);
  return (DATA.dividends||[]).map(rec=>{
    const accounts = rec.accounts.filter(a=>accIds.includes(a.accountId));
    const total = accounts.reduce((s,a)=>s+a.amount,0);
    return { ...rec, accounts, total };
  }).filter(rec=>rec.accounts.length>0);
}
function isWithinLast12Months(monthStr){
  if(!monthStr) return false;
  const parts = monthStr.split('-').map(Number);
  const y = parts[0], m = parts[1];
  if(!y || !m) return false;
  const target = new Date(y, m-1, 1);
  const now = new Date();
  const cutoff = new Date(now.getFullYear(), now.getMonth()-11, 1);
  const upper = new Date(now.getFullYear(), now.getMonth(), 1);
  return target >= cutoff && target <= upper;
}
function stockDividendTTM(stock){
  return recordsForStock(stock).filter(r=>isWithinLast12Months(r.month)).reduce((s,r)=>s+(r.amount||0),0);
}
// 기준2: 최근 12개월 배당 ÷ 총 투자원금 (=평균매입단가×수량) — 지금 페이스가 앞으로도 이어진다면의 수익률
function stockYieldOnAvgPrice(stock){
  const cost = stockCostBasis(stock);
  if(!cost) return null;
  return (stockDividendTTM(stock) / cost) * 100;
}
// 기준3: 최근 12개월 배당 ÷ 현재 평가금액 — 지금 이 가격에 새로 산다면의 수익률(시장 비교용)
function stockYieldOnCurrentPrice(stock){
  const mv = stockTotal(stock);
  if(!mv) return null;
  return (stockDividendTTM(stock) / mv) * 100;
}

let tooltipAnchorEl = null;

function positionTooltip(anchorEl, titleHtml, bodyHtml){
  closeYieldTooltip();
  tooltipAnchorEl = anchorEl;
  const rect = anchorEl.getBoundingClientRect();
  const tip = document.createElement('div');
  tip.className = 'yield-tooltip';
  tip.id = 'yieldTooltip';
  tip.innerHTML = `<div class="yield-tooltip-title">${titleHtml}</div><div>${bodyHtml}</div>`;
  document.body.appendChild(tip);

  const tipRect = tip.getBoundingClientRect();
  const margin = 10;
  let left = rect.left + rect.width/2 - tipRect.width/2;
  left = Math.max(margin, Math.min(left, window.innerWidth - tipRect.width - margin));

  let top = rect.top - tipRect.height - margin;
  let arrowCls = 'arrow-down';
  if(top < margin){
    top = rect.bottom + margin;
    arrowCls = 'arrow-up';
  }
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';

  const arrow = document.createElement('div');
  arrow.className = 'yield-tooltip-arrow ' + arrowCls;
  const arrowLeft = Math.max(12, Math.min(rect.left + rect.width/2 - left, tipRect.width - 12));
  arrow.style.left = arrowLeft + 'px';
  tip.appendChild(arrow);

  requestAnimationFrame(()=> tip.classList.add('show'));
  setTimeout(()=>{
    document.addEventListener('click', closeYieldTooltip, { once:true });
    document.addEventListener('scroll', closeYieldTooltip, { once:true, capture:true });
  }, 0);
}

function toggleTooltip(anchorEl, titleHtml, bodyHtml){
  const wasOpenOnSameAnchor = !!document.getElementById('yieldTooltip') && tooltipAnchorEl === anchorEl;
  closeYieldTooltip();
  if(wasOpenOnSameAnchor) return;
  positionTooltip(anchorEl, titleHtml, bodyHtml);
}

function showYieldTooltip(evt, type){
  evt.stopPropagation();
  const info = YIELD_TOOLTIP_INFO[type];
  if(!info) return;
  toggleTooltip(evt.currentTarget, info.title, info.desc);
}

function fmtPL(n){

// 자산 추이의 증감처럼 부호가 필요한 곳용
function fmtPLSigned(n){

  return sign + '<span class="won-sign">₩</span>' + Math.abs(n).toLocaleString('ko-KR');
}
function fmtPercent(n){
  if(n===null) return '';
  const sign = n > 0 ? '+' : (n < 0 ? '-' : '');
  return sign + Math.abs(n).toFixed(2) + '%';
}
function fmtPctPlain(n){
  if(n===null) return '-';
  return n.toFixed(2) + '%';
}
function plClass(n){

// ===== 월별 배당 캘린더 =====
function monthlyDividendSeries(ownerId, monthsBack){
  const now = new Date();
  const series = [];
  for(let i=monthsBack-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    series.push({ month: ym, label: (d.getMonth()+1)+'월', amount: 0, isCurrent: i===0 });
  }
  const map = {};
  series.forEach(s=> map[s.month]=s);
  recordsForOwner(ownerId).forEach(rec=>{
    if(map[rec.month]) map[rec.month].amount += rec.total;
  });
  return series;
}

function upsertSnapshot(){
  ensureDataShape();
  const today = new Date().toISOString().slice(0,10);
  const totals = {};
  DATA.owners.forEach(o=>{ totals[o.id] = ownerTotal(o.id); });
  totals['ALL'] = ownerTotal('ALL');
  const idx = DATA.snapshots.findIndex(s=>s.date===today);
  if(idx>=0) DATA.snapshots[idx] = { date: today, totals };
  else DATA.snapshots.push({ date: today, totals });
  DATA.snapshots.sort((a,b)=>a.date.localeCompare(b.date));
}

  const points = values.map((v,i)=>{

    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return {x, y};
  });
  const polyPoints = points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const areaPoints = `${pad},${h-pad} ${polyPoints} ${w-pad},${h-pad}`;

  const first = values[0];
  const prev = values[values.length-2];
  const last = values[values.length-1];
  const delta = last - prev;
  const deltaPct = prev ? (delta/prev)*100 : null;
  const firstDelta = last - first;
  const firstDeltaPct = first ? (firstDelta/first)*100 : null;

      <div class="trend-svg-wrap">
        <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none">
          <polygon points="${areaPoints}" fill="var(--mint-dim)" opacity="0.6"></polygon>
          <polyline points="${polyPoints}" fill="none" stroke="var(--mint)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>

      <div class="trend-caption-row">

function allItemsBreakdown(){
  const map = {};
  DATA.stocks.forEach(s=>{
    const key = s.key;
    if(!map[key]){
      const cat = catalogFor(s);
      map[key] = { key, name: cat.name, ticker: cat.ticker||'', value:0, cost:0, count:0, quantity:0 };
    }
    map[key].value += stockTotal(s);
    map[key].cost += stockCostBasis(s);
    map[key].count += 1;
    map[key].quantity += (s.quantity||0);
  });
  return Object.values(map);
}

function stocksMatchingKey(key){
  return DATA.stocks.filter(s=>s.key===key);
}

function safeId(str){
  return str.replace(/[^a-zA-Z0-9_-]/g, '_');
}

function renderBreakdown(){
  const el = document.getElementById('breakdownSection');
  const items = allItemsBreakdown();
  const grandTotal = items.reduce((s,i)=>s+i.value,0);

  if(items.length===0){
    el.innerHTML = '';
    return;
  }

  const sorted = [...items].sort((a,b)=> b.value - a.value);

  const targetSum = sorted.reduce((s,item)=>{
    const t = DATA.targets[item.key];
    return s + (typeof t === 'number' ? t : 0);
  }, 0);

  const rows = sorted.map(item=>{
    const pl = item.value - item.cost;
    const plPct = item.cost ? (pl/item.cost)*100 : null;
    const ratio = grandTotal ? (item.value/grandTotal)*100 : 0;
    const sid = safeId(item.key);
    const keyEsc = item.key.replace(/'/g,"\\'");
    const target = DATA.targets[item.key];
    const hasTarget = typeof target === 'number' && !isNaN(target);

    const cat = catalogByKey(item.key);
    const currentPrice = cat ? (cat.currentPrice||0) : 0;

    return `
      <div class="breakdown-row cursor-pointer" onclick="openTargetSheet('${keyEsc}','${sid}')">
        <div class="breakdown-top">
          <div class="breakdown-name-block">
            <div class="breakdown-name">${escapeHtml(item.name)}${item.ticker ? ' <span class="suffix-text text-dim">('+escapeHtml(item.ticker)+')</span>' : ''}</div>
            <div class="breakdown-price-line">평가금액 ${fmtWon(item.value)} · 현재가 <span class="price-highlight"><span class="won-sign">₩</span>${currentPrice.toLocaleString('ko-KR')}</span></div>
            <div class="breakdown-price-line">총 ${item.quantity.toLocaleString('ko-KR')}주${hasTarget ? ' · 목표 '+target+'%' : ''}</div>
          </div>
          <div class="breakdown-right">
            <span class="breakdown-ratio num">${ratio.toFixed(2)}%</span>
            <div class="breakdown-pl num ${plClass(pl)}">${fmtPL(pl)}${plPct!==null ? ' ('+fmtPercent(plPct)+')' : ''}</div>
          </div>
        </div>
        <div class="breakdown-bar-track">
          <div class="breakdown-bar-fill" style="--w:${ratio}%;"></div>
        </div>
      </div>
    `;
  }).join('');

  const targetSumHint = targetSum > 0
    ? `<div class="hint-text">입력된 목표비율 합계: ${targetSum.toFixed(2)}%${Math.abs(targetSum-100) > 0.01 ? ' (100%가 되도록 맞추면 더 정확해요)' : ' ✓'}</div>`
    : '';

  el.innerHTML = `
    <div class="section-divider-gray spaced-top"></div>
    <div class="breakdown-wrap">
      <div class="breakdown-title mt-40" id="breakdownToggle">전체 포트폴리오 비율</div>
      ${breakdownOpen ? `<div class="breakdown-card">${rows}</div>${targetSumHint}` : ''}
    </div>
  `;
  document.getElementById('breakdownToggle').onclick = ()=>{
    breakdownOpen = !breakdownOpen;
    renderBreakdown();
  };
}

          <span class="amt num">${fmtWon(stockTotal(s))}${plPct!==null ? ' <span class="'+plClass(pl)+'">('+fmtPercent(plPct)+')</span>' : ''}</span>
          ${CHEVRON_SVG}
        </span>
      </div>
    `;
  }).join('');
}

// 포트폴리오 모음 > 종목 상세(보유현황)에서 계좌 항목을 누르면:
// 기존에 열려있던 시트(보유현황/목표관리)는 그대로 유지한 채, 그 위에 2단계 시트로
// 매수/매도 입력이 가능한 종목 상세를 띄운다. 닫으면 자동으로 원래 시트가 다시 보인다.
function openStockDetailFromBreakdown(stockId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(!stock) return;
  const cat = catalogFor(stock);
  openSheet2(cat.name, buildStockDetailHtml(stock));
}

function dividendFlatListHtmlForKey(key){
  const records = recordsForKey(key);
  if(records.length===0) return `<div class="empty-hint">기록 없음</div>`;
  return records.map(rec=>{
    const total = rec.accounts.reduce((s,a)=>s+a.amount,0);
    const dateLabel = fmtDateDot(rec.date || rec.month);
    const keyEsc = key.replace(/'/g,"\\'");
    return `
      <div class="entry-row">
        <span>${dateLabel}${rec.perShare ? ' · 주당 <span class="won-sign">₩</span>'+rec.perShare.toLocaleString('ko-KR') : ''}</span>
        <span><span class="amt num">${fmtWon(total)}</span><span class="del-icon" onclick="deleteKeyDividendRecord('${keyEsc}','${rec.month}')">🗑️</span></span>
      </div>
    `;
  }).join('');
}

function openKeyDividendSheet(key){
  openSheet2('배당현황', dividendFlatListHtmlForKey(key));
}

let openTargetSheetLayer = { key: null, layer: null };

async function deleteKeyDividendRecord(key, month){
  deleteDividendRecord(key, month);
  await saveData();
  render();
  if(document.getElementById('bottomSheet2').classList.contains('open')){
    document.getElementById('sheetBody2').innerHTML = dividendFlatListHtmlForKey(key);
  }
  refreshOpenTargetSheet();
  showToast('배당 기록을 삭제했어요');
}

function refreshOpenTargetSheet(){
  const { key, layer } = openTargetSheetLayer;
  if(!key) return;
  const sid = safeId(key);
  if(layer===1 && document.getElementById('bottomSheet').classList.contains('open')){
    openTargetSheet(key, sid);
  } else if(layer===2 && document.getElementById('bottomSheet2').classList.contains('open')){
    openTargetSheetNested(key, sid);
  }
}

function buildTargetSheetContent(key, sid){
  const items = allItemsBreakdown();
  const item = items.find(i=>i.key===key);
  if(!item) return;

  const keyEsc = key.replace(/'/g,"\\'");

  const divTotal = dividendTotalForKey(key);
  const divTTM = dividendTTMForKey(key);
  const y2 = item.cost ? (divTTM/item.cost)*100 : null;
  const y3 = item.value ? (divTTM/item.value)*100 : null;
  const keyPL = item.value - item.cost;
  const keyPLPct = item.cost ? (keyPL/item.cost)*100 : null;

  const bodyHtml = `
    <div class="stat-rows mb-16">
      <div class="stat-row">
        <div class="stock-stat"><span class="stock-stat-label">평가금액</span><span class="stock-stat-value num">${fmtWon(item.value)}</span></div>
        <div class="stock-stat"><span class="stock-stat-label">평가손익</span><span class="stock-stat-value num ${plClass(keyPL)}">${fmtPL(keyPL)}${keyPLPct!==null ? ' ('+fmtPercent(keyPLPct)+')' : ''}</span></div>
      </div>
      <div class="stat-row">
        <div class="stock-stat"><span class="stock-stat-label">투자원금</span><span class="stock-stat-value num">${fmtWon(item.cost)}</span></div>
        <div class="stock-stat"><span class="stock-stat-label">보유수량</span><span class="stock-stat-value num">${item.quantity.toLocaleString('ko-KR')}주</span></div>
      </div>
    </div>
    <div class="panel-title sub-title">보유현황</div>
    ${holdingsListHtmlForKey(key)}

    <div class="mt-20 pt-14 divider-top">
      <div class="panel-title sub-title title-row cursor-pointer" onclick="openKeyDividendSheet('${keyEsc}')"><span>배당현황</span>${CHEVRON_SVG}</div>
      <div class="yield-grid">
        <div class="yield-card" onclick="showYieldTooltip(event,2)">
          <div class="yield-label">최근 12개월<br>평균매입가 기준</div>
          <div class="yield-value num">${fmtPctPlain(y2)}</div>
        </div>
        <div class="yield-card" onclick="showYieldTooltip(event,3)">
          <div class="yield-label">최근 12개월<br>현재가 기준</div>
          <div class="yield-value num">${fmtPctPlain(y3)}</div>
        </div>
      </div>
      <div class="stat-footnote">누적 배당 ${fmtWon(divTotal)} · 최근 12개월 ${fmtWon(divTTM)}</div>
    </div>

    <div class="form-panel" id="grpform_${sid}">
      <div class="form-row">
        <div class="field">
          <span class="field-label">새 현재가 (주당)</span>
          <input type="number" inputmode="decimal" placeholder="예: 25000" id="grpprice_${sid}">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" onclick="closeForm('grpform_${sid}')">취소</button>
        <button class="btn-primary" onclick="applyGroupPrice('${keyEsc}','${sid}')">전체 계좌에 반영</button>
      </div>
    </div>
    <div class="form-panel" id="divgrpform_${sid}">
      <div class="form-row">
        <div class="field">
          <span class="field-label">배당일</span>
          <div class="date-display-wrap">
            <span class="date-display-text" id="divgrp_date_${sid}_display" data-placeholder="날짜 선택">날짜 선택</span>
            <input type="date" id="divgrp_date_${sid}" class="date-native-hidden" onchange="syncDateDisplay(this)">
          </div>
        </div>
        <div class="field">
          <span class="field-label">주당 배당금</span>
          <input type="number" inputmode="decimal" placeholder="예: 500" id="divgrp_amount_${sid}">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-ghost" onclick="closeForm('divgrpform_${sid}')">취소</button>
        <button class="btn-primary" onclick="applyGroupDividend('${keyEsc}','${sid}')">전체 계좌에 반영</button>
      </div>
    </div>
    <div class="button-row mt-20">
      <button class="cta-btn" onclick="openGroupPriceForm('${keyEsc}','${sid}')">현재가</button>
      <button class="cta-btn" onclick="openGroupDividendForm('${keyEsc}','${sid}')">배당</button>
    </div>
  `;

function openDividendLink(key){
  const cat = catalogByKey(key);
  if(cat && cat.dividendUrl){
    window.open(cat.dividendUrl, '_blank', 'noopener');
  } else {
    showToast('배당확인 링크가 아직 설정되지 않았어요 (stockCatalog의 dividendUrl 필드에 추가해주세요)');
  }
}

function openTargetSheet(key, sid){
  const content = buildTargetSheetContent(key, sid);
  if(!content) return;
  openTargetSheetLayer = { key, layer: 1 };
  openSheet(content.title, content.bodyHtml, ()=>openDividendLink(key));
  document.getElementById('sheetTitle').insertAdjacentHTML('beforeend', CHEVRON_SVG);
}

function openTargetSheetNested(key, sid){
  const content = buildTargetSheetContent(key, sid);
  if(!content) return;
  openTargetSheetLayer = { key, layer: 2 };
  openSheet2(content.title, content.bodyHtml, ()=>openDividendLink(key));
  document.getElementById('sheetTitle2').insertAdjacentHTML('beforeend', CHEVRON_SVG);
}

async function applyGroupPrice(key, sid){
  const input = document.getElementById(`grpprice_${sid}`);
  const num = parseFloat(input.value);
  if(isNaN(num)){ showToast('숫자를 입력해주세요'); return; }
  const cat = catalogByKey(key);
  if(!cat){ showToast('종목 정보를 찾을 수 없어요'); return; }
  cat.currentPrice = num;
  const count = stocksMatchingKey(key).length;
  closeForm(`grpform_${sid}`);
  await saveData();
  render();
  refreshOpenTargetSheet();
  showToast(`현재가를 반영했어요 (${count}개 계좌에 자동 적용)`);
}

function openGroupPriceForm(key, sid){
  const panel = document.getElementById(`grpform_${sid}`);
  const willOpen = !panel.classList.contains('open');
  closeForm(`divgrpform_${sid}`);
  panel.classList.toggle('open', willOpen);
  if(willOpen){
    const input = document.getElementById(`grpprice_${sid}`);
    input.value = '';
    input.focus();
    scrollToId(`grpform_${sid}`);
  }
}

function openGroupDividendForm(key, sid){
  const panel = document.getElementById(`divgrpform_${sid}`);
  const willOpen = !panel.classList.contains('open');
  closeForm(`grpform_${sid}`);
  panel.classList.toggle('open', willOpen);
  if(willOpen){
    document.getElementById(`divgrp_amount_${sid}`).value = '';
    scrollToId(`divgrpform_${sid}`);
  }
}

async function applyGroupDividend(key, sid){
  const date = document.getElementById(`divgrp_date_${sid}`).value;
  const perShare = parseFloat(document.getElementById(`divgrp_amount_${sid}`).value) || 0;
  if(!date){ showToast('배당일을 선택해주세요'); return; }
  if(!perShare){ showToast('주당 배당금을 입력해주세요'); return; }
  const cat = catalogByKey(key);
  const stockList = stocksMatchingKey(key).map(s=>({ accountId:s.accountId, quantity:quantityAsOfDate(s, date) }));
  const rec = upsertDividendGroupBulk(key, date, cat ? cat.name : '', cat ? cat.ticker : '', perShare, stockList);
  const total = rec.accounts.reduce((s,a)=>s+a.amount,0);
  closeForm(`divgrpform_${sid}`);
  await saveData();
  render();
  refreshOpenTargetSheet();
  showToast(`${rec.accounts.length}개 계좌에 총 ₩${total.toLocaleString('ko-KR')} 반영했어요`);
}

function renderAccounts(){
  const list = document.getElementById('accountList');
  const isAll = currentOwner === 'ALL';
  document.getElementById('accountsLabel').textContent = isAll ? '전체 계좌' : '계좌';
  // 전체 보기에서는 계좌를 넣을 주인을 고를 수 있게 한다
  document.getElementById('accountOwnerRow').classList.toggle('hidden', !isAll);
  const ownerSel = document.getElementById('newAccountOwner');
  const ownerOptions = (DATA.owners||[]).map(o=>`<option value="${o.id}">${escapeHtml(o.name)}</option>`).join('');
  if(ownerSel.innerHTML !== ownerOptions){
    const prev = ownerSel.value;
    ownerSel.innerHTML = ownerOptions;
    if(prev && (DATA.owners||[]).some(o=>o.id===prev)) ownerSel.value = prev;
  }
  const accounts = accountsForOwner(currentOwner);
  if(accounts.length===0){
    list.innerHTML = `<div class="empty-state">아직 등록된 계좌가 없습니다.<br>위 '계좌 추가' 버튼으로 시작해보세요.</div>`;
    return;
  }
  list.innerHTML = '';
  accounts.forEach(acc=>{
    const ownerName = isAll ? (DATA.owners.find(o=>o.id===acc.ownerId)||{}).name : null;
    const accTotal = accountTotal(acc.id);
    const accCost = accountCostBasis(acc.id);
    const accPL = accTotal - accCost;
    const accPLPct = accCost ? (accPL/accCost)*100 : null;
    const card = document.createElement('div');
    card.className = 'account-card';
    card.id = `acccard_${acc.id}`;
    card.innerHTML = `
      <div class="account-head" data-acc="${acc.id}">
        <div>
          <div class="account-name">${escapeHtml(acc.name)}${ownerName ? ' <span class="suffix-text text-dim">('+escapeHtml(ownerName)+')</span>' : ''}</div>
        </div>
        <div class="account-suffix-wrap">
          <div class="account-total num account-total-value">${fmtWon(accTotal)}</div>
          <div class="account-pl-line">
            <span class="num ${plClass(accPL)}">${fmtPL(accPL)}</span>${accPLPct!==null ? ' <span class="num '+plClass(accPL)+'">('+fmtPercent(accPLPct)+')</span>' : ''}
          </div>
        </div>
      </div>
    `;
    card.querySelector('.account-head').onclick = ()=> openAccountSheet(acc.id);
    list.appendChild(card);
  });
}

// 계좌를 누르면 바텀시트 1개로 종목 목록을 보여준다. 종목을 누르면 새 시트를 쌓지 않고
// 같은 시트 안에서 종목 상세로 화면만 바뀌고, 헤더 왼쪽 ‹ 로 계좌 목록으로 돌아온다.
function openAccountSheet(accId){
  const acc = DATA.accounts.find(a=>a.id===accId);
  if(!acc) return;
  const owner = (DATA.owners||[]).find(o=>o.id===acc.ownerId);
  const title = acc.name + (currentOwner==='ALL' && owner ? ` (${owner.name})` : '');
  const stocks = stocksForAccount(acc.id);
  const rows = stocks.map(st=>{
    const cat = catalogFor(st);
    const pl = stockPL(st);
    const plPct = stockPLPercent(st);
    return `
      <div class="acc-stock-row" onclick="openStockDetailSheet('${st.id}')">
        <div class="acc-stock-name">${escapeHtml(cat.name)}${cat.ticker ? '<span class="acc-stock-ticker">('+escapeHtml(cat.ticker)+')</span>' : ''}</div>
        <div class="acc-stock-right">
          <div class="num">${fmtWon(stockTotal(st))}</div>
          <div class="num acc-stock-pl ${plClass(pl)}">${fmtPL(pl)}${plPct!==null ? ' ('+fmtPercent(plPct)+')' : ''}</div>
        </div>
        ${CHEVRON_SVG}
      </div>
    `;
  }).join('');
  openSheet(title, `
    <div class="account-row-head">
      <span class="empty-hint p-0">종목 ${stocks.length}개</span>
      <button class="mini-add" onclick="openStockPickerSheet('${acc.id}')">+ 종목 추가</button>
    </div>
    ${rows || '<div class="empty-hint">아직 등록된 종목이 없어요</div>'}
  `);
}

function openStockPickerSheet(accountId){
  const cats = [...(DATA.stockCatalog||[])].sort((a,b)=>a.name.localeCompare(b.name));
  const rows = cats.map(c=>{
    const keyEsc = c.key.replace(/'/g,"\\'");
    return `
      <div class="entry-row cursor-pointer" onclick="addHoldingFromCatalog('${accountId}','${keyEsc}')">
        <span>${escapeHtml(c.name)}${c.ticker ? ' <span class="text-faint">('+escapeHtml(c.ticker)+')</span>' : ''}</span>
        <span class="amt num"><span class="won-sign">₩</span>${(c.currentPrice||0).toLocaleString('ko-KR')}</span>
      </div>
    `;
  }).join('');

  const bodyHtml = `
    ${cats.length ? rows : '<div class="empty-hint">아직 등록된 종목이 없어요. 아래에서 새로 등록해보세요.</div>'}
    <div class="mt-14 pt-14 divider-top">
      <div class="panel-caption mt-0 mb-8">목록에 없는 종목이면 새로 등록하세요 (현재가·수량·매수내역은 등록 후에 채우면 돼요)</div>
      <div class="form-row">
        <input type="text" placeholder="종목명 (예: 뱅가드 S&P500)" id="newcat_name_${accountId}" list="stockCatalogNames">
        <input type="text" placeholder="티커 (선택)" id="newcat_ticker_${accountId}" list="stockCatalogTickers">
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="createCatalogAndAdd('${accountId}')">새 종목으로 추가</button>
      </div>
    </div>
  `;
  openSheet('종목 선택', bodyHtml, null, ()=>openAccountSheet(accountId));
}

async function addHoldingFromCatalog(accountId, key){
  const cat = catalogByKey(key);
  if(!cat) return;
  const newStock = { id: uid('stk'), accountId, key, quantity:0, buys:[], sells:[] };
  DATA.stocks.push(newStock);
  await saveData();
  render();
  showToast(`${cat.name} 추가됨 · 매수 내역을 등록해주세요`);
  openStockDetailSheet(newStock.id);
}

async function createCatalogAndAdd(accountId){
  const name = document.getElementById(`newcat_name_${accountId}`).value.trim();
  const ticker = document.getElementById(`newcat_ticker_${accountId}`).value.trim();
  if(!name){ showToast('종목명을 입력해주세요'); return; }
  const { cat } = getOrCreateCatalog(ticker, name, 0);
  const newStock = { id: uid('stk'), accountId, key: cat.key, quantity:0, buys:[], sells:[] };
  DATA.stocks.push(newStock);
  await saveData();
  render();
  showToast(`${cat.name} 새로 등록됨 · 현재가와 매수 내역을 등록해주세요`);
  openStockDetailSheet(newStock.id);
}

function openStockDetailSheet(stockId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(!stock) return;
  const cat = catalogFor(stock);
  // const title = cat.name + (cat.ticker ? ` (${cat.ticker})` : '');
  const title = cat.name;
  const accId = stock.accountId;
  openSheet(title, buildStockDetailHtml(stock), null, ()=>openAccountSheet(accId));
}

// 두 시트(1단계/2단계) 중 실제로 이 종목의 상세(매수/매도 폼)를 보여주고 있는 쪽만
// 골라서 새로고침한다. buyform_${stockId} 마커로 판단하므로, 같은 시트가
// 매수내역/매도내역 같은 다른 화면을 보여주고 있을 때는 건드리지 않는다.
function refreshStockDetailSheetIfOpen(stockId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(!stock) return;
  [['bottomSheet','sheetBody'], ['bottomSheet2','sheetBody2']].forEach(([sheetId, bodyId])=>{
    const sheetEl = document.getElementById(sheetId);
    const bodyEl = document.getElementById(bodyId);
    if(sheetEl.classList.contains('open') && bodyEl.querySelector(`#buyform_${stockId}`)){
      bodyEl.innerHTML = buildStockDetailHtml(stock);
    }
  });
}

function buildStockDetailHtml(stock){
  const keyEsc = stock.key.replace(/'/g,"\\'");
  const hasBuys = stock.buys && stock.buys.length>0;
  const hasSells = stock.sells && stock.sells.length>0;
  const value = stockTotal(stock);
  const cost = stockCostBasis(stock);
  const pl = stockPL(stock);
  const plPct = stockPLPercent(stock);
  const qty = stock.quantity || 0;
  const price = catalogFor(stock).currentPrice || 0;
  const avgPrice = qty ? Math.round(cost / qty) : 0;
  const divMonths = [...new Set(recordsForStock(stock).map(r=>parseInt(r.month.split('-')[1],10)))].sort((a,b)=>a-b);
  const divMonthsStr = divMonths.length ? divMonths.join(', ') : '-';
  const divYield = stockYieldOnAvgPrice(stock);
  const divTTM = stockDividendTTM(stock);
  return `
    <div class="stat-rows mb-16">
      <div class="stat-row">
        <div class="stock-stat"><span class="stock-stat-label">평가금액</span><span class="stock-stat-value num">${fmtWon(value)}</span></div>
        <div class="stock-stat"><span class="stock-stat-label">평가손익</span><span class="stock-stat-value num ${plClass(pl)}">${fmtPL(pl)}${plPct!==null ? ' ('+fmtPercent(plPct)+')' : ''}</span></div>
      </div>
      <div class="stat-row">
        <div class="stock-stat"><span class="stock-stat-label">투자원금</span><span class="stock-stat-value num">${fmtWon(cost)}</span></div>
        <div class="stock-stat"><span class="stock-stat-label">보유수량</span><span class="stock-stat-value num">${(stock.quantity||0).toLocaleString('ko-KR')}주</span></div>
      </div>
      <div class="stat-row">
        <div class="stock-stat"><span class="stock-stat-label">평균단가</span><span class="stock-stat-value num"><span class="won-sign">₩</span>${avgPrice.toLocaleString('ko-KR')}</span></div>
        <div class="stock-stat"><span class="stock-stat-label">현재가</span><span class="stock-stat-value num price-highlight"><span class="won-sign">₩</span>${price.toLocaleString('ko-KR')}</span></div>
      </div>
      <div class="stat-row">
        <div class="stock-stat"><span class="stock-stat-label">배당월</span><span class="stock-stat-value">${divMonthsStr}</span></div>
        <div class="stock-stat"><span class="stock-stat-label">배당률</span><span class="stock-stat-value num text-gold cursor-pointer" onclick="showStockDividendYieldTooltip(event,'${stock.id}')">${fmtPctPlain(divYield)}${divTTM ? ' ('+fmtWon(divTTM)+')' : ''}</span></div>
      </div>
    </div>
     ${hasBuys ? `
     <div class="panel-title sub-title mb-4">매수</div>
     ${entryListHtml(stock.buys, stock.id, 'buys')}
     ` : ''}
    <div class="form-panel" id="buyform_${stock.id}">
        ${txFormHtml(stock.id,'buys')}
      </div>
    ${hasSells ? `
    <div class="panel-title sub-title ${hasBuys ? 'mt-12 ' : ''}mb-4">매도</div>
     ${entryListHtml(stock.sells, stock.id, 'sells')}
     ` : ''}
      <div class="form-panel" id="sellform_${stock.id}">
        ${txFormHtml(stock.id,'sells')}

function scrollToId(id){
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const el = document.getElementById(id);
      if(!el) return;
      const sheetBody2 = document.getElementById('sheetBody2');
      const sheetBody = document.getElementById('sheetBody');
      const container = (sheetBody2 && sheetBody2.contains(el)) ? sheetBody2
        : (sheetBody && sheetBody.contains(el)) ? sheetBody
        : null;
      if(container){
        const cRect = container.getBoundingClientRect();
        const eRect = el.getBoundingClientRect();
        const delta = eRect.top - cRect.top - (cRect.height * 0.15);
        container.scrollBy({ top: delta, behavior:'smooth' });
        return;
      }
      const rect = el.getBoundingClientRect();
      const targetY = window.innerHeight * 0.5;
      const delta = rect.top - targetY;
      window.scrollBy({ top: delta, behavior:'smooth' });
    });
  });
}

function syncDateDisplay(inputEl){

let openSheetCount = 0;
function lockBodyScroll(){
  openSheetCount++;
  if(openSheetCount===1){
    const scrollY = window.scrollY || window.pageYOffset || 0;
    document.body.dataset.scrollY = scrollY;
    document.documentElement.classList.add('scroll-locked');
    document.body.classList.add('body-scroll-locked');
    document.body.style.top = `-${scrollY}px`;
  }
}
function unlockBodyScroll(){
  openSheetCount = Math.max(0, openSheetCount-1);
  if(openSheetCount===0){
    const y = parseInt(document.body.dataset.scrollY || '0', 10);
    document.documentElement.classList.remove('scroll-locked');
    document.body.classList.remove('body-scroll-locked');
    document.body.style.top = '';
    window.scrollTo(0, y);
  }
}

function recalcPensionSheet(){
  const owners = DATA.owners || [];
  const taxSelect = document.getElementById('pensionTaxRate');
  if(!taxSelect) return;
  const selectedRate = parseFloat(taxSelect.value) || 5.5;

  let grandTotalMonthlyNet = 0;

  owners.forEach(owner=>{
    const accounts = accountsForOwner(owner.id);
    let ownerAnnual = 0;
    const perAccount = accounts.map(acc=>{
      const totalInput = document.getElementById(`pension_total_${acc.id}`);
      const yieldInput = document.getElementById(`pension_yield_${acc.id}`);
      if(!totalInput || !yieldInput) return null;
      const total = parseFloat(totalInput.value.replace(/,/g,'')) || 0;
      const yieldPct = parseFloat(yieldInput.value) || 0;
      const annual = total * (yieldPct/100);
      ownerAnnual += annual;
      return { id: acc.id, annual };
    }).filter(Boolean);

    const overLimit = ownerAnnual > 15000000;
    const effectiveRate = overLimit ? 16.5 : selectedRate;

    perAccount.forEach(a=>{
      const monthlyNet = (a.annual * (1 - effectiveRate/100)) / 12;
      const el = document.getElementById(`pension_result_${a.id}`);
      if(el) el.innerHTML = fmtWon(Math.round(monthlyNet));
    });

    const ownerMonthlyNet = (ownerAnnual * (1 - effectiveRate/100)) / 12;
    grandTotalMonthlyNet += ownerMonthlyNet;

    const ownerTotalEl = document.getElementById(`pensionOwnerTotal_${owner.id}`);
    if(ownerTotalEl) ownerTotalEl.innerHTML = fmtWon(Math.round(ownerMonthlyNet));

    const noteEl = document.getElementById(`pensionOwnerOverLimit_${owner.id}`);
    if(noteEl) noteEl.classList.toggle('hidden', !overLimit);
  });

  const totalEl = document.getElementById('pensionTotalResult');
  if(totalEl) totalEl.innerHTML = fmtWon(Math.round(grandTotalMonthlyNet));
}

async function submitTx(stockId, field){
  const date = document.getElementById(`${field}_date_${stockId}`).value;
  const qty = parseFloat(document.getElementById(`${field}_qty_${stockId}`).value) || 0;
  const price = parseFloat(document.getElementById(`${field}_price_${stockId}`).value) || 0;
  if(!date){ showToast('날짜를 입력해주세요'); return; }
  if(!qty || !price){ showToast('수량과 단가를 입력해주세요'); return; }
  const amt = qty * price;
  const stock = DATA.stocks.find(s=>s.id===stockId);
  if(!stock[field]) stock[field] = [];
  stock[field].push({ id: uid('tx'), date, quantity: qty, price: price, amount: amt });
  if(field==='buys'){
    stock.quantity = (stock.quantity||0) + qty;
  } else if(field==='sells'){
    stock.quantity = Math.max(0, (stock.quantity||0) - qty);
  }
  recalcDividendQuantitiesForStock(stock);
  await saveData();
  render();
  refreshStockDetailSheetIfOpen(stockId);
  showToast(`${qty}주 × ₩${price.toLocaleString('ko-KR')} = ₩${amt.toLocaleString('ko-KR')} 반영했어요`);
}

async function deleteEntry(stockId, field, entryId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  const entry = (stock[field]||[]).find(e=>e.id===entryId);
  stock[field] = (stock[field]||[]).filter(e=>e.id!==entryId);
  if(entry && field==='buys'){
    stock.quantity = Math.max(0, (stock.quantity||0) - entry.quantity);
  } else if(entry && field==='sells'){
    stock.quantity = (stock.quantity||0) + entry.quantity;
  }
  recalcDividendQuantitiesForStock(stock);
  await saveData();
  render();
  refreshStockDetailSheetIfOpen(stockId);
  showToast('삭제하고 보유수량도 되돌렸어요');
}

async function deleteStock(stockId){
  const stock = DATA.stocks.find(s=>s.id===stockId);
  const accIdOfStock = stock ? stock.accountId : null;
  if(stock){
    (DATA.dividends||[]).forEach(rec=>{
      if(rec.key===stock.key){
        rec.accounts = rec.accounts.filter(a=>a.accountId!==stock.accountId);
      }
    });
    DATA.dividends = (DATA.dividends||[]).filter(rec=>rec.accounts.length>0);
  }
  DATA.stocks = DATA.stocks.filter(s=>s.id!==stockId);
  openStocks.delete(stockId);
  await saveData();
  render();
  // 계좌 시트 안에서 열었던 상세면 계좌 목록으로 돌아가고, 그 외(포트폴리오 모음 등)는 기존처럼 닫는다

function showGithubSaveInfo(evt){
  evt.stopPropagation();
  toggleTooltip(evt.currentTarget, 'GitHub 저장', '현재 데이터를 GitHub 저장소의 stock.json에 바로 커밋해요. 최초 1회만 위의 "저장 설정"을 입력하면, 이후엔 이 브라우저에서 버튼 한 번으로 저장돼요.');
}

async function pushToGithub(){
  const { repo, path, token } = loadGithubSettings();
  const statusEl = document.getElementById('githubSaveStatus');
  if(!repo || !path || !token){
    showToast('먼저 "저장 설정"에서 저장소/경로/토큰을 입력해주세요');
    document.getElementById('githubSettingsForm').classList.add('open');
    return;
  }
  statusEl.textContent = 'GitHub에 저장하는 중...';
  try{
    const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
    const getRes = await fetch(apiUrl, {
      headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' }
    });
    let sha;
    if(getRes.ok){
      const getData = await getRes.json();
      sha = getData.sha;
    } else if(getRes.status !== 404){
      throw new Error(`파일 조회 실패 (${getRes.status})`);
    }
    const content = utf8ToBase64(JSON.stringify(DATA, null, 2));
    const putRes = await fetch(apiUrl, {
      method: 'PUT',
      headers: {
        'Authorization': `token ${token}`,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        message: 'chore: stock.json 업데이트 (앱에서 자동 저장)',
        content,
        sha
      })
    });
    if(!putRes.ok){
      const err = await putRes.json().catch(()=>({}));
      throw new Error(err.message || `저장 실패 (${putRes.status})`);
    }
    statusEl.textContent = '저장 완료 · ' + new Date().toLocaleTimeString('ko-KR');
    showToast('GitHub에 저장했어요');
  }catch(e){
    statusEl.textContent = '저장 실패: ' + e.message;
    showToast('GitHub 저장에 실패했어요');
  }
}

document.getElementById('githubSettingsToggle').onclick = ()=>{
  const settings = loadGithubSettings();
  document.getElementById('gh_repo').value = settings.repo;
  document.getElementById('gh_path').value = settings.path;
  document.getElementById('gh_token').value = settings.token;
  toggleForm('githubSettingsForm');
};

function refreshJsonView(){
  document.getElementById('jsonTextarea').value = JSON.stringify(DATA, null, 2);
  document.getElementById('jsonError').classList.remove('show');
}

async function applyParsedData(parsed, successMsg){
  if(!parsed || !parsed.owners || !parsed.accounts || !parsed.stocks){
    document.getElementById('jsonError').textContent = 'owners, accounts, stocks 세 항목이 모두 있어야 합니다.';
    document.getElementById('jsonError').classList.add('show');
    return false;
  }
  document.getElementById('jsonError').classList.remove('show');
  DATA = parsed;
  if(!DATA.owners.find(o=>o.id===currentOwner) && currentOwner!=='ALL'){
    currentOwner = DATA.owners.length ? DATA.owners[0].id : null;
  }
  await saveData();
  render();
  showToast(successMsg || '데이터를 적용했습니다');
  return true;
}

async function applyJson(){
  const raw = document.getElementById('jsonTextarea').value;
  let parsed;
  try{
    parsed = JSON.parse(raw);
  }catch(e){
    document.getElementById('jsonError').classList.add('show');
    return;
  }
  await applyParsedData(parsed, 'JSON 데이터가 적용되었습니다');
}

function copyJson(){
  const text = document.getElementById('jsonTextarea').value || JSON.stringify(DATA, null, 2);
  navigator.clipboard.writeText(text).then(()=>{
    showToast('클립보드에 복사되었습니다');
  }).catch(()=>{
    showToast('복사에 실패했습니다. 직접 선택해 복사해주세요');
  });
}

function exportJsonFile(){
  const text = JSON.stringify(DATA, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'stock.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('stock.json 파일을 내보냈어요');
}

function triggerImportFile(){
  document.getElementById('importFileInput').click();
}

document.getElementById('importFileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    let parsed;
    try{
      parsed = JSON.parse(evt.target.result);
    }catch(err){
      showToast('올바른 JSON 파일이 아니에요');
      e.target.value = '';
      return;
    }
    const ok = await applyParsedData(parsed, 'stock.json을 불러왔어요');
    if(ok) refreshJsonView();
    e.target.value = '';
  };
  reader.readAsText(file);
});

loadData();
