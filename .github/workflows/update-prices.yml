name: Update KRX Stock Prices

on:
  schedule:
    # 평일(월~금) 09:00~16:00 KST(=UTC 00:00~07:00) 사이 30분마다 실행
    # → 장마감(15:30 KST) 이후 16:00 KST에도 한 번 더 돌아서 종가 반영 지연까지 커버
    - cron: '*/30 0-7 * * 1-5'
  workflow_dispatch: {}   # 필요할 때 수동으로도 실행 가능 (Actions 탭 > Run workflow)

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install finance-datareader pandas

      - name: 주가 갱신 스크립트 실행
        run: python update_prices.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || git commit -m "chore: 주가 자동 갱신 [skip ci]"
          git push
