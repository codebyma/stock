name: Daily Asset Snapshot

on:
  schedule:
    # 평일 15:00 KST(=UTC 06:00)에 실행.
    # UTC 06:00 → KST 15:00은 같은 날짜 내 시각이라 날짜가 안 밀림.
    # (자정 근처 KST 스케줄과 달리 요일(1-5)을 그대로 써도 안전함)
    #
    # 그날 마지막 시세 갱신(update-prices.yml, 15:00 KST)이 끝난 직후 시점이라
    # 해당 갱신분이 반영된 "오늘" 종가 기준 스냅샷이 그대로 저장됨.
    - cron: '00 6 * * 1-5'
  workflow_dispatch: {}   # 필요할 때 수동으로도 실행 가능 (Actions 탭 > Run workflow)

permissions:
  contents: write

jobs:
  daily-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 오늘 자산 스냅샷 계산 및 반영
        run: python daily_snapshot.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || git commit -m "chore: 자산 스냅샷 자동 저장 [skip ci]"
          git push
