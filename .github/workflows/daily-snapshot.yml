name: Daily Asset Snapshot

on:
  schedule:
    # 평일 23:50 KST(=UTC 14:50)에 실행.
    # 그날 마지막 시세 갱신(update-prices.yml, 16:00 KST)이 끝난 뒤이면서
    # 아직 날짜가 안 바뀐 시점 → "오늘" 날짜로 그날 종가 기준 스냅샷이 저장됨.
    # (자정 정각에 돌리면 KST 기준으로 이미 다음 날이 되어 하루씩 밀리므로 피함)
    - cron: '50 14 * * 1-5'
  workflow_dispatch: {}   # 필요할 때 수동으로도 실행 가능 (Actions 탭 > Run workflow)

permissions:
  contents: write

jobs:
  daily-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 오늘 자산 스냅샷 계산 및 반영
        run: python daily_snapshot.py

      - name: 변경사항 커밋 및 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || git commit -m "chore: 자산 스냅샷 자동 저장 [skip ci]"
          git push
